<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Overview of the succinct zero-knowledge proof system: LaBRADOS, LNP-Lite, LaBRADOS, LaBRADOR">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="260" fill="#fff"/>
  <g font-family="monospace" font-size="26" fill="#000" text-anchor="middle">
    <!-- input arrow -->
    <line x1="8" y1="100" x2="52" y2="100" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- boxes -->
    <rect x="60" y="70" width="170" height="60" rx="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="145" y="107">LaBRADOS</text>
    <rect x="320" y="70" width="170" height="60" rx="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="405" y="107">LNP-Lite</text>
    <rect x="580" y="70" width="170" height="60" rx="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="665" y="107">LaBRADOS</text>
    <rect x="810" y="70" width="170" height="60" rx="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="895" y="107">LaBRADOR</text>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#000" text-anchor="middle">
    <!-- arrows between boxes -->
    <line x1="232" y1="100" x2="312" y2="100" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="272" y="82">Section 3.1</text>
    <line x1="492" y1="100" x2="572" y2="100" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="532" y="82">Section 3.4</text>
    <line x1="752" y1="100" x2="802" y2="100" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="777" y="82">[15]</text>
    <text x="272" y="200">Sections 3.2 and 3.3</text>
  </g>
  <!-- iteration loops -->
  <g fill="none" stroke="#000" stroke-width="2.5">
    <path d="M 195 130 C 195 178, 95 178, 95 132" marker-end="url(#arrow)"/>
    <path d="M 715 130 C 715 178, 615 178, 615 132" marker-end="url(#arrow)"/>
    <path d="M 955 130 C 955 178, 855 178, 855 132" marker-end="url(#arrow)"/>
    <!-- output arrow -->
    <line x1="895" y1="130" x2="895" y2="212" marker-end="url(#arrow)"/>
  </g>
</svg>
